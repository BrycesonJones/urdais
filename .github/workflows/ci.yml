name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Validation only needs to read the repository.
permissions:
  contents: read

# Cancel superseded runs for the same branch / pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # Single source of truth for the Node version is .nvmrc.
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # Database foundation: migrations bootstrap from zero on a real PostgreSQL 17
  # (matching the hosted engine), pass the database tests, and replay
  # deterministically. No hosted project and no secrets are involved; CI never
  # touches UrdaisDev. Only psql is needed, which the runner image provides.
  database:
    name: database
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      URDAIS_PG_EXTERNAL: "1"
      URDAIS_DB_NAME: urdais_ci
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Bootstrap platform roles, replay migrations from zero twice, run database tests
        run: scripts/db/local.sh ci
