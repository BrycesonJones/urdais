name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Validation only needs to read the repository.
permissions:
  contents: read

# Cancel superseded runs for the same branch / pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # Single source of truth for the Node version is .nvmrc.
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # Cheap, credential-free, and first: a duplicate migration version prefix
      # makes `supabase db push` record one file and silently never run the
      # other, which is expensive to find and costs nothing to prevent.
      #
      # `--base-ref` closes the window a branch cannot see on its own. Two open
      # pull requests can each add a migration, each be green, and the second to
      # merge lands a duplicate version. On a pull request this checks the union
      # of this branch's migrations and the merge target's, so the collision is
      # caught before the merge; on a push to main the union is the repository
      # itself and the check fails immediately after it.
      - name: Check migration integrity
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "${GITHUB_BASE_REF}"
            npm run migrations:check -- --base-ref FETCH_HEAD
          else
            npm run migrations:check
          fi

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # Production readiness for Token Price. A deployment verifies that the data is
  # ready; it never manufactures the human verification that produced it, so this
  # job only reads. It runs when a production database URL is configured for the
  # repository and is skipped otherwise, because there is nothing to check.
  token-production-readiness:
    name: token production readiness
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check that production Token Price benchmarks exist
        env:
          DATABASE_URL: ${{ secrets.URDAIS_PRODUCTION_DATABASE_URL }}
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "no production database configured for this repository; skipping the readiness check."
            echo "set the URDAIS_PRODUCTION_DATABASE_URL secret to enforce it before deployment."
            exit 0
          fi
          npm run tokens:production:check

  # Production migration-ledger integrity. Separate from the static check in
  # `validate` because it is a different claim: that one says the repository is
  # structurally valid, this one says production's bookkeeping agrees with the
  # repository about what it has applied. It needs production credentials, so it
  # runs on the production-readiness path rather than on every unit-test run,
  # and it is its own job so that an unrelated production *data* condition
  # cannot mask it, or be masked by it.
  #
  # It reads one query and repairs nothing. A repository migration production has
  # not applied yet is reported as pending and passes; drift -- a ledger row
  # carrying a repository migration under a different version or an ad hoc
  # `_prod` name, or a production-only row -- fails and names the remedy.
  migration-production-integrity:
    name: production migration ledger
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # Connects as `urdais_migration_audit`, which holds exactly two grants: USAGE on
      # supabase_migrations and SELECT on its one table. It cannot write the ledger, read any
      # application schema, or create anything. This job reads one query; it has no business
      # holding a credential that could do more.
      - name: Compare the production migration ledger against the repository
        env:
          DATABASE_URL: ${{ secrets.URDAIS_MIGRATION_AUDIT_DATABASE_URL }}
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "no migration audit database configured for this repository; skipping the ledger check."
            echo "set the URDAIS_MIGRATION_AUDIT_DATABASE_URL secret to enforce it."
            exit 0
          fi
          npm run migrations:check -- --production --require-database

  # Database foundation: migrations bootstrap from zero on a real PostgreSQL 17
  # (matching the hosted engine), pass the database tests, and replay
  # deterministically. No hosted project and no secrets are involved; CI never
  # touches UrdaisDev. Only psql is needed, which the runner image provides.
  database:
    name: database
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      URDAIS_PG_EXTERNAL: "1"
      URDAIS_DB_NAME: urdais_ci
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Bootstrap platform roles, replay migrations from zero twice, run database tests
        run: scripts/db/local.sh ci
