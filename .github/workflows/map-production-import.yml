name: Map production import

on:
  workflow_dispatch:
    inputs:
      write:
        description: Write the canonical facility dataset to production
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: map-production-import
  cancel-in-progress: false

jobs:
  import:
    name: ${{ inputs.write && 'import and verify' || 'dry run' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prove production identity, ledger and facility schema
        env:
          DATABASE_URL: ${{ secrets.URDAIS_PRODUCTION_DATABASE_URL }}
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "production database secret is unavailable"
            exit 1
          fi
          npm run migrations:check -- --production --require-database
          npx tsx scripts/map/verify-production.ts --pre-import

      - name: Plan production import without writing
        env:
          DATABASE_URL: ${{ secrets.URDAIS_PRODUCTION_DATABASE_URL }}
        run: |
          npm run --silent map:import | tee "${RUNNER_TEMP}/map-import-dry-run.json"
          npx tsx scripts/map/assert-import-report.ts dry-run "${RUNNER_TEMP}/map-import-dry-run.json"

      - name: Import canonical facilities
        if: ${{ inputs.write }}
        env:
          DATABASE_URL: ${{ secrets.URDAIS_PRODUCTION_DATABASE_URL }}
        run: |
          npm run --silent map:import -- --write | tee "${RUNNER_TEMP}/map-import-write.json"
          npx tsx scripts/map/assert-import-report.ts write "${RUNNER_TEMP}/map-import-write.json"

      - name: Prove importer idempotence
        if: ${{ inputs.write }}
        env:
          DATABASE_URL: ${{ secrets.URDAIS_PRODUCTION_DATABASE_URL }}
        run: |
          npm run --silent map:import -- --write | tee "${RUNNER_TEMP}/map-import-idempotent.json"
          npx tsx scripts/map/assert-import-report.ts idempotent "${RUNNER_TEMP}/map-import-idempotent.json"

      - name: Verify production database, API and map endpoint
        if: ${{ inputs.write }}
        env:
          DATABASE_URL: ${{ secrets.URDAIS_PRODUCTION_DATABASE_URL }}
        run: npx tsx scripts/map/verify-production.ts --post-write
